name: taskmate
description: "TaskMate — Smart To-Do List for Busy Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # UI & Design
  google_fonts: ^8.2.1
  flutter_slidable: ^4.0.3
  shimmer: ^4.0.0
  animations: ^3.0.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
